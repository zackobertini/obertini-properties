<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Obertini Properties Tenant Portal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    nav { margin-bottom: 20px; }
    nav button { margin-right: 10px; padding: 10px 15px; cursor: pointer; }
    section { display: none; margin-top: 20px; }
    section.active { display: block; }
    #message { margin-top: 15px; color: green; }
    #error { margin-top: 15px; color: red; }
  </style>
</head>
<body>
  <h1>Welcome to Obertini Properties Tenant Portal</h1>

  <!-- Tenant login form -->
  <div id="login-section">
    <h2>Tenant Login / Sign Up</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="signup()">Sign Up</button>
    <p id="login-message"></p>
  </div>

  <!-- Tenant dashboard -->
  <div id="dashboard" style="display:none;">
    <nav>
      <button onclick="showTab('pay-rent')">Pay Rent</button>
      <button onclick="showTab('maintenance')">Maintenance Request</button>
      <button onclick="showTab('view-lease')">View Lease</button>
      <button onclick="showTab('sign-lease')">Sign New Lease</button>
    </nav>

    <section id="pay-rent">
      <h2>Pay Rent</h2>
      <button onclick="payRent()">Pay Rent Now</button>
      <p id="message"></p>
      <p id="error"></p>
    </section>

    <section id="maintenance">
      <h2>Maintenance Request</h2>
      <p>Feature coming soon!</p>
    </section>

    <section id="view-lease">
      <h2>View Lease</h2>
      <p>Feature coming soon!</p>
    </section>

    <section id="sign-lease">
      <h2>Sign New Lease</h2>
      <p>Feature coming soon!</p>
    </section>
  </div>

  <!-- Firebase script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

    // Firebase configuration
    const firebaseConfig = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Login function
    window.login = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const loginMsg = document.getElementById("login-message");

      if (!email || !password) {
        loginMsg.innerText = "Please enter email and password.";
        return;
      }

      signInWithEmailAndPassword(auth, email, password)
        .then(() => {
          loginMsg.innerText = "Logged in successfully!";
          document.getElementById("login-section").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          showTab('pay-rent'); // default tab
        })
        .catch((error) => { loginMsg.innerText = error.message; });
    };

    // Signup function
    window.signup = function() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const loginMsg = document.getElementById("login-message");

      if (!email || !password) {
        loginMsg.innerText = "Please enter email and password.";
        return;
      }

      createUserWithEmailAndPassword(auth, email, password)
        .then(() => loginMsg.innerText = "Account created! You can now log in.")
        .catch((error) => loginMsg.innerText = error.message);
    };

    // Tab switching
    function showTab(tabId) {
      document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      document.getElementById('message').innerText = '';
      document.getElementById('error').innerText = '';
    }

    // Stripe Pay Rent function
    async function payRent() {
      const message = document.getElementById('message');
      const error = document.getElementById('error');

      message.innerText = '';
      error.innerText = '';

      try {
        // ⚠️ Replace with your Stripe publishable key
        const stripe = Stripe('pk_test_51T2JrFRpNMZCmY3rxInmimKUuQZ7FGZc5EFdn9pTsLtFYRxoF68GLiIHf5yqCNMAxoU825vaui6IhSCcuGNDeo3Z0058hSu3x7');

        const response = await fetch('/api/create-checkout-session', { method: 'POST' });
        const data = await response.json();

        if (data.error) {
          error.innerText = data.error;
          return;
        }

        const result = await stripe.redirectToCheckout({ sessionId: data.id });
        if (result.error) {
          error.innerText = result.error.message;
        }
      } catch (err) {
        console.error(err);
        error.innerText = 'Failed to initiate payment. Please try again.';
      }
    }

    window.payRent = payRent;
  </script>

  <!-- Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>
</body>
</html>
